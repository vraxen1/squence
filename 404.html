<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Squence</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="topbar.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{overflow:hidden;background:#050318;color:#fff}
.background{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(circle at 18% 20%,rgba(168,85,255,.18),transparent 30%),radial-gradient(circle at 82% 72%,rgba(89,104,255,.14),transparent 32%),linear-gradient(135deg,#050318,#09062b)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:float 12s ease-in-out infinite}
.orb.one{width:52vw;height:52vw;min-width:420px;min-height:420px;background:#7c3cff;left:-16vw;top:-20vh}
.orb.two{width:46vw;height:46vw;min-width:360px;min-height:360px;background:#1f8cff;right:-18vw;bottom:-22vh;animation-delay:-6s}
.grid{position:fixed;inset:0;z-index:-1;opacity:.035;background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at center,#000 20%,transparent 75%)}
main{min-height:calc(100vh - 76px);display:flex;align-items:center;justify-content:center;padding:40px 6%;position:relative}
.error-shell{width:min(860px,100%);text-align:center;position:relative}
.code{font-size:clamp(120px,24vw,250px);font-weight:900;letter-spacing:-.09em;line-height:.72;margin-left:-.09em;background:linear-gradient(135deg,#fff 0%,#c6b8ff 42%,#6baeff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 35px rgba(130,105,255,.22))}
.card{max-width:680px;margin:28px auto 0;padding:38px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.025));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 30px 100px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.1)}
.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;border:1px solid rgba(168,85,255,.28);background:rgba(168,85,255,.08);color:#c9b7ff;font-size:11px;font-weight:800;letter-spacing:.08em;margin-bottom:18px}
h1{font-size:clamp(30px,5vw,52px);letter-spacing:-.055em;margin-bottom:14px}
p{max-width:520px;margin:auto;color:#aaa6bf;font-size:15px;line-height:1.7}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}
.button{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:11px;text-decoration:none;font-size:13px;font-weight:750;transition:.2s}
.button:hover{transform:translateY(-3px)}
.primary{color:#fff;background:linear-gradient(135deg,#a855ff,#5968ff);box-shadow:0 10px 30px rgba(111,47,255,.25)}
.secondary{color:#fff;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.hint{margin-top:22px;color:#706c83;font-size:11px}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(45px,-30px) scale(1.06)}}
body.squence-shared-page.alpine .background{background:radial-gradient(circle at 20% 20%,rgba(120,174,202,.18),transparent 30%),radial-gradient(circle at 80% 72%,rgba(61,115,153,.16),transparent 34%),linear-gradient(150deg,#0b3554,#061f35)}
body.alpine .orb.one{background:#78aeca}body.alpine .orb.two{background:#3d7399}
body.alpine .code{background:linear-gradient(135deg,#fff,#c7dce5 45%,#78aeca);-webkit-background-clip:text;background-clip:text}
body.alpine .badge{border-color:rgba(156,197,220,.26);background:rgba(120,174,202,.09);color:#b8d7e4}
body.alpine .card{border-color:rgba(156,197,220,.16);background:linear-gradient(135deg,rgba(160,198,216,.11),rgba(20,65,96,.08))}
body.alpine p{color:#a9bdd0}body.alpine .primary{background:linear-gradient(135deg,#78aeca,#3d7399);box-shadow:0 10px 30px rgba(35,101,142,.28)}
body.tulip .background{background:radial-gradient(circle at 18% 20%,rgba(227,138,169,.17),transparent 30%),radial-gradient(circle at 82% 72%,rgba(184,95,135,.14),transparent 32%),linear-gradient(135deg,#170b13,#321322)}
body.tulip .orb.one{background:#e38aa9}body.tulip .orb.two{background:#b85f87}
body.tulip .code{background:linear-gradient(135deg,#fff7f9,#f0b7c8 45%,#e38aa9);-webkit-background-clip:text;background-clip:text}
body.tulip .badge{border-color:rgba(239,154,180,.25);background:rgba(227,138,169,.08);color:#f0b7c8}
body.tulip .card{border-color:rgba(239,154,180,.16);background:linear-gradient(135deg,rgba(239,154,180,.10),rgba(62,24,42,.08))}
body.tulip p{color:#c5a5b0}body.tulip .primary{background:linear-gradient(135deg,#e38aa9,#b85f87);box-shadow:0 10px 30px rgba(190,72,117,.25)}
@media(max-width:850px){main{min-height:calc(100vh - 68px)}}
@media(max-width:600px){main{padding:30px 18px}.card{padding:30px 20px;border-radius:22px}.code{font-size:clamp(110px,31vw,180px)}}
</style>
</head>
<body>
<div class="background"><div class="orb one"></div><div class="orb two"></div></div>
<div class="grid"></div>
<main>
  <section class="error-shell">
    <div class="code">404</div>
    <div class="card">
      <div class="badge">✦ LOST IN SQUENCE</div>
      <h1>This page doesn't exist.</h1>
      <p>The page may have moved, been renamed, or simply never existed. Either way, let's get you somewhere useful.</p>
      <div class="actions">
        <a href="./" class="button primary">← Back to Squence</a>
        <a href="games.html" class="button secondary">Explore Games</a>
      </div>
      <div class="hint">Error 404 · Page not found</div>
    </div>
  </section>
</main>
<script src="topbar.js"></script>
</body>
</html>
