<!DOCTYPE html>
<html>
<head>
    <title>Squence — Click Rush</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0f;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid #24242c;
            background: #101015;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
            color: white;
            text-decoration: none;
        }

        .logo span { opacity: 0.45; }

        main {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .game {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .game-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #777;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 48px;
            letter-spacing: -2px;
        }

        .description {
            color: #888;
            margin: 12px 0 35px;
            font-size: 16px;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            flex: 1;
            background: #15151b;
            border: 1px solid #26262f;
            border-radius: 14px;
            padding: 18px;
        }

        .stat-label {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #777;
            margin-bottom: 6px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
        }

        #clickButton {
            width: 100%;
            height: 190px;
            border: 1px solid #33333d;
            border-radius: 18px;
            background: #f5f5f5;
            color: #101015;
            font-size: 42px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.08s, background 0.15s, box-shadow 0.15s;
        }

        #clickButton:hover {
            background: white;
            box-shadow: 0 0 35px rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        #clickButton:active { transform: scale(0.97); }

        #clickButton:disabled {
            cursor: default;
            opacity: 0.55;
            transform: none;
            box-shadow: none;
        }

        #result {
            min-height: 28px;
            margin-top: 22px;
            font-size: 19px;
            font-weight: 600;
        }

        #restartButton {
            display: none;
            margin-top: 15px;
            padding: 12px 24px;
            border: 1px solid #303039;
            border-radius: 10px;
            background: #15151b;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.15s;
        }

        #restartButton:hover { background: #22222a; }

        @media (max-width: 500px) {
            header { padding: 0 20px; }
            h1 { font-size: 40px; }
            #clickButton { height: 160px; font-size: 34px; }
            .stat-number { font-size: 27px; }
        }
    </style>
</head>

<body>

    <header>
        <a class="logo" href="index.html" aria-label="Squence homepage">
            squence<span>.</span>
        </a>
    </header>

    <main>
        <div class="game">
            <div class="game-label">Squence Games</div>
            <h1>Click Rush</h1>
            <p class="description">How many times can you click in 10 seconds?</p>

            <div class="stats">
                <div class="stat">
                    <div class="stat-label">CLICKS</div>
                    <div class="stat-number" id="score">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">TIME</div>
                    <div class="stat-number" id="time">10</div>
                </div>
            </div>

            <button id="clickButton">CLICK!</button>
            <div id="result"></div>
            <button id="restartButton">Play Again</button>
        </div>
    </main>

    <script>
        let score = 0;
        let time = 10;
        let gameStarted = false;
        let timer;

        const button = document.getElementById("clickButton");
        const scoreText = document.getElementById("score");
        const timeText = document.getElementById("time");
        const result = document.getElementById("result");
        const restartButton = document.getElementById("restartButton");

        button.onclick = function() {
            if (!gameStarted) {
                gameStarted = true;

                timer = setInterval(function() {
                    time--;
                    timeText.textContent = time;

                    if (time <= 0) {
                        clearInterval(timer);
                        button.disabled = true;
                        button.textContent = "TIME'S UP!";
                        result.textContent = "You got " + score + " clicks.";
                        restartButton.style.display = "inline-block";
                    }
                }, 1000);
            }

            if (time > 0) {
                score++;
                scoreText.textContent = score;
            }
        };

        restartButton.onclick = function() {
            score = 0;
            time = 10;
            gameStarted = false;

            scoreText.textContent = "0";
            timeText.textContent = "10";
            button.disabled = false;
            button.textContent = "CLICK!";
            result.textContent = "";
            restartButton.style.display = "none";
        };
    </script>

</body>
</html>
