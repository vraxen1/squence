<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squence — Neon Snake</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="topbar.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--background,#050318);color:var(--text,#fff);font-family:Inter,Arial,sans-serif;min-height:100vh}.background{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent,#a855ff) 18%,transparent),transparent 35%),linear-gradient(145deg,var(--background,#050318),var(--background2,#09062b))}.game-page{max-width:980px;margin:auto;padding:110px 20px 50px}.eyebrow{color:var(--accent,#a855ff);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.title{text-align:center;margin-bottom:30px}.title h1{font-size:clamp(38px,7vw,64px);letter-spacing:-3px;margin:8px 0}.title p{color:var(--muted,#aaa);margin:0}.panel{background:var(--card,rgba(14,11,45,.78));border:1px solid var(--card-border,rgba(151,92,255,.2));border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.25)}button{font:inherit;cursor:pointer}.btn{border:1px solid var(--card-border,rgba(255,255,255,.2));background:rgba(255,255,255,.08);color:var(--text,#fff);padding:11px 18px;border-radius:12px;font-weight:700}.btn:hover{transform:translateY(-2px)}.primary{background:linear-gradient(135deg,var(--accent,#a855ff),var(--accent2,#5968ff));border:none}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.stat{padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.05);color:var(--muted,#aaa)}.stat b{color:var(--text,#fff);font-size:22px;margin-left:5px}canvas{display:block;width:min(100%,600px);height:auto;margin:auto;border-radius:18px;touch-action:none}.controls{text-align:center;margin:15px}.controls button{margin:3px;min-width:48px}</style></head><body><div class="background"></div><main class="game-page"><div class="title"><div class="eyebrow">Squence Games</div><h1>Neon Snake</h1><p>A modern arcade classic. Use arrow keys or WASD.</p><div class="stats"><div class="stat">Score <b id="score">0</b></div><div class="stat">Best <b id="best">0</b></div></div><div class="panel"><canvas id="c" width="600" height="600"></canvas><div class="controls"><button class="btn" data-d="up">↑</button><div><button class="btn" data-d="left">←</button><button class="btn" data-d="down">↓</button><button class="btn" data-d="right">→</button></div></div><div style="text-align:center"><button class="btn primary" id="restart">Restart</button></div></div></div></main><script src="topbar.js"></script><script>const c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=30;let snake,food,dx,dy,score,best=+localStorage.snakeBest||0,timer;document.getElementById('best').textContent=best;function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dx=1;dy=0;score=0;food={x:3,y:3};clearInterval(timer);timer=setInterval(step,115);draw()}function step(){let h={x:(snake[0].x+dx+N)%N,y:(snake[0].y+dy+N)%N};if(snake.some(s=>s.x===h.x&&s.y===h.y)){best=Math.max(best,score);localStorage.snakeBest=best;document.getElementById('best').textContent=best;reset();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;do food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};while(snake.some(s=>s.x===food.x&&s.y===food.y))}else snake.pop();document.getElementById('score').textContent=score;draw()}function draw(){x.fillStyle='#070817';x.fillRect(0,0,600,600);x.fillStyle='#ff62bd';x.fillRect(food.x*S+5,food.y*S+5,S-10,S-10);snake.forEach((s,i)=>{x.fillStyle=i?'#8f6bff':'#fff';x.fillRect(s.x*S+3,s.y*S+3,S-6,S-6)})}function move(d){if(d==='up'&&dy!==1){dx=0;dy=-1}if(d==='down'&&dy!==-1){dx=0;dy=1}if(d==='left'&&dx!==1){dx=-1;dy=0}if(d==='right'&&dx!==-1){dx=1;dy=0}}document.addEventListener('keydown',e=>{let m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(m){e.preventDefault();move(m)}});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));document.getElementById('restart').onclick=reset;reset();</script></body></html>
