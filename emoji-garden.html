<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squence Emoji Garden</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="topbar.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,Arial,sans-serif}.garden-page{max-width:1050px;margin:auto;padding:105px 20px 60px;text-align:center}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.garden-page h1{font-size:clamp(42px,7vw,68px);letter-spacing:-3px;margin:8px 0}.garden-page p{color:var(--muted)}.panel{margin-top:25px;padding:18px;background:var(--card);border:1px solid var(--card-border);border-radius:25px}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px}.stat{padding:10px 16px;background:rgba(255,255,255,.06);border-radius:12px}.toolbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.btn{border:1px solid var(--card-border);background:rgba(255,255,255,.08);color:var(--text);padding:10px 16px;border-radius:11px;font:inherit;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none}.garden{display:grid;grid-template-columns:repeat(12,1fr);aspect-ratio:1.7;min-height:330px;border-radius:18px;overflow:hidden;background:linear-gradient(#8ed6ff 0 38%,#75c76c 38% 100%);border:1px solid var(--card-border);touch-action:none}.plot{position:relative;border:1px solid rgba(255,255,255,.08);cursor:crosshair;min-height:42px;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,2.4vw,31px);transition:.15s}.plot:hover{background:rgba(255,255,255,.13);transform:scale(1.03);z-index:2}.plot.filled{background:rgba(255,255,255,.04)}@media(max-width:600px){.garden{grid-template-columns:repeat(8,1fr);aspect-ratio:1;min-height:420px}}
</style></head><body><div class="background"><div class="orb one"></div><div class="orb two"></div></div><main class="garden-page"><div class="eyebrow">Squence Games · Creative</div><h1>🌱 Emoji Garden</h1><p>Move over the garden to grow nature. Click a block to plant the emoji.</p><div class="stats"><div class="stat">Garden plants: <b id="count">0</b></div><div class="stat">Your garden saves on this device</div></div><div class="panel"><div class="toolbar"><button class="btn primary" id="random">Random garden</button><button class="btn" id="clear">Clear garden</button></div><div class="garden" id="garden"></div></div></main><script src="topbar.js"></script><script>
const emojis=['🌱','🌿','☘️','🍀','🌷','🌸','🌼','🌻','🌺','🌹','🪻','🪴','🌲','🌳','🍃','🍂','🍁','🪨','🍄','🌾','🌵','🌴','🐝','🦋','🐞'];
const garden=document.getElementById('garden'),count=document.getElementById('count');let saved=JSON.parse(localStorage.emojiGarden||'[]');const cells=[];
function make(){for(let i=0;i<120;i++){let d=document.createElement('div');d.className='plot';d.dataset.i=i;let val=saved[i]||'';d.textContent=val;if(val)d.classList.add('filled');d.addEventListener('pointerenter',()=>{if(!d.textContent)d.textContent=emojis[Math.floor(Math.random()*emojis.length)]});d.addEventListener('pointerleave',()=>{if(!d.classList.contains('filled'))d.textContent=''});d.addEventListener('pointerdown',e=>{e.preventDefault();if(!d.textContent)d.textContent=emojis[Math.floor(Math.random()*emojis.length)];d.classList.add('filled');saved[i]=d.textContent;save()});garden.appendChild(d);cells.push(d)}save()}
function save(){localStorage.emojiGarden=JSON.stringify(saved);count.textContent=cells.filter(c=>c.classList.contains('filled')).length}
document.getElementById('clear').onclick=()=>{saved=[];cells.forEach(c=>{c.textContent='';c.classList.remove('filled')});save()}
document.getElementById('random').onclick=()=>{cells.forEach((c,i)=>{if(Math.random()>.42){c.textContent=emojis[Math.floor(Math.random()*emojis.length)];c.classList.add('filled');saved[i]=c.textContent}});save()}
make();
</script></body></html>
