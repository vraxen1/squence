<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - Squence</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="topbar.css"><link rel="icon" type="image/png" href="favicon.png">
<style>
.coming-soon-card{background:rgba(140,92,255,.03);border:1px solid rgba(140,92,255,.15);box-shadow:0 0 40px rgba(140,92,255,.05),inset 0 0 20px rgba(140,92,255,.02);border-radius:24px;padding:60px 40px;text-align:center;max-width:600px;width:100%;margin:auto;backdrop-filter:blur(10px)}.neon-glow{text-shadow:0 0 10px rgba(140,92,255,.5),0 0 20px rgba(140,92,255,.3)}.feature-list{display:flex;flex-direction:column;gap:12px;max-width:380px;margin:30px auto;text-align:left}.feature-item{display:flex;align-items:center;gap:12px;color:#aaa;font-size:15px}.feature-item span{color:#9c7cff;text-shadow:0 0 8px rgba(140,92,255,.6)}.notify-box{display:flex;gap:10px;max-width:400px;margin:25px auto 0}.neon-input{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(140,92,255,.2);padding:14px 20px;border-radius:12px;color:white;font-size:15px;outline:none}.neon-input:focus{border-color:#9c7cff;box-shadow:0 0 15px rgba(140,92,255,.25)}@media(max-width:500px){.notify-box{flex-direction:column}}
</style>
</head>
<body>
<div class="background"><div class="orb one"></div><div class="orb two"></div></div>
<main><section style="min-height:calc(100vh - 100px);display:flex;align-items:center;justify-content:center;padding:40px 20px"><div class="coming-soon-card">
<div class="badge" style="margin-bottom:20px">👤 Squence Profile</div>
<h1 class="neon-glow" style="font-size:clamp(35px,6vw,55px);line-height:1;letter-spacing:-2px;margin-bottom:15px;background:linear-gradient(120deg,#fff,#9c7cff,#bfadff);-webkit-background-clip:text;background-clip:text;color:transparent">ACCOUNTS<br>COMING SOON</h1>
<p style="color:#888;font-size:16px;line-height:1.5;max-width:450px;margin:0 auto">We are working hard to build a unified system. Get ready to experience personalized navigation across Squence.</p>
<div class="feature-list"><div class="feature-item"><span>✦</span>Save and track game progress</div><div class="feature-item"><span>✦</span>Synchronize your tailored news feed</div><div class="feature-item"><span>✦</span>Manage cloud backups and favorites</div></div>
<form class="notify-box" onsubmit="event.preventDefault();alert('You will be notified!')"><input type="email" placeholder="Enter your email address" class="neon-input" required><button type="submit" class="button primary" style="padding:14px 24px;white-space:nowrap">Notify Me</button></form>
</div></section></main>
<script src="topbar.js"></script>
</body></html>
