<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squence — Squence Draw</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="topbar.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--background,#050318);color:var(--text,#fff);font-family:Inter,Arial,sans-serif;min-height:100vh}.background{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent,#a855ff) 18%,transparent),transparent 35%),linear-gradient(145deg,var(--background,#050318),var(--background2,#09062b))}.game-page{max-width:980px;margin:auto;padding:110px 20px 50px}.eyebrow{color:var(--accent,#a855ff);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.title{text-align:center;margin-bottom:30px}.title h1{font-size:clamp(38px,7vw,64px);letter-spacing:-3px;margin:8px 0}.title p{color:var(--muted,#aaa);margin:0}.panel{background:var(--card,rgba(14,11,45,.78));border:1px solid var(--card-border,rgba(151,92,255,.2));border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.25)}button{font:inherit;cursor:pointer}.btn{border:1px solid var(--card-border,rgba(255,255,255,.2));background:rgba(255,255,255,.08);color:var(--text,#fff);padding:11px 18px;border-radius:12px;font-weight:700}.btn:hover{transform:translateY(-2px)}.primary{background:linear-gradient(135deg,var(--accent,#a855ff),var(--accent2,#5968ff));border:none}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.stat{padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.05);color:var(--muted,#aaa)}.stat b{color:var(--text,#fff);font-size:22px;margin-left:5px}.toolbar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar input[type=range]{max-width:150px}canvas{display:block;width:100%;height:auto;background:#fff;border-radius:18px;touch-action:none}</style></head><body><div class="background"></div><main class="game-page"><div class="title"><div class="eyebrow">Squence Games</div><h1>Squence Draw</h1><p>A calm creative space. Draw whatever comes to mind.</p><div class="panel"><div class="toolbar"><input id="color" type="color" value="#a855ff"><input id="size" type="range" min="1" max="60" value="8"><button class="btn" id="undo">Undo</button><button class="btn" id="clear">Clear</button><button class="btn primary" id="save">Save PNG</button></div><canvas id="c" width="1000" height="650"></canvas><p id="prompt" style="text-align:center;color:var(--muted)">Prompt: Draw something that belongs on another planet.</p><div style="text-align:center"><button class="btn" id="promptBtn">New Prompt</button></div></div></div></main><script src="topbar.js"></script><script></script></body></html>
