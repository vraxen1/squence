<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squence — Memory Grid</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="topbar.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--background,#050318);color:var(--text,#fff);font-family:Inter,Arial,sans-serif;min-height:100vh}.background{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent,#a855ff) 18%,transparent),transparent 35%),linear-gradient(145deg,var(--background,#050318),var(--background2,#09062b))}.game-page{max-width:980px;margin:auto;padding:110px 20px 50px}.eyebrow{color:var(--accent,#a855ff);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.title{text-align:center;margin-bottom:30px}.title h1{font-size:clamp(38px,7vw,64px);letter-spacing:-3px;margin:8px 0}.title p{color:var(--muted,#aaa);margin:0}.panel{background:var(--card,rgba(14,11,45,.78));border:1px solid var(--card-border,rgba(151,92,255,.2));border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.25)}button{font:inherit;cursor:pointer}.btn{border:1px solid var(--card-border,rgba(255,255,255,.2));background:rgba(255,255,255,.08);color:var(--text,#fff);padding:11px 18px;border-radius:12px;font-weight:700}.btn:hover{transform:translateY(-2px)}.primary{background:linear-gradient(135deg,var(--accent,#a855ff),var(--accent2,#5968ff));border:none}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.stat{padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.05);color:var(--muted,#aaa)}.stat b{color:var(--text,#fff);font-size:22px;margin-left:5px}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:520px;margin:15px auto 25px}.tile{aspect-ratio:1;border-radius:16px;border:1px solid var(--card-border);background:rgba(255,255,255,.05);transition:.15s}.tile.on{background:var(--accent);box-shadow:0 0 30px var(--accent)}</style></head><body><div class="background"></div><main class="game-page"><div class="title"><div class="eyebrow">Squence Games</div><h1>Memory Grid</h1><p>Remember the glowing tiles, then repeat the pattern.</p><div class="stats"><div class="stat">Level <b id="level">1</b></div><div class="stat">Best <b id="best">1</b></div></div><div class="panel"><div id="grid"></div><p id="status" style="text-align:center;color:var(--muted)">Watch carefully…</p><div style="text-align:center"><button class="btn primary" id="start">Start Game</button></div></div></div></main><script src="topbar.js"></script><script>const grid=document.getElementById('grid'),status=document.getElementById('status');let seq=[],input=[],level=1,locked=true,best=+localStorage.memoryBest||1;document.getElementById('best').textContent=best;for(let i=0;i<16;i++){let d=document.createElement('button');d.className='tile';d.onclick=()=>tap(i);grid.appendChild(d)}const tiles=[...document.querySelectorAll('.tile')];function flash(i){tiles[i].classList.add('on');setTimeout(()=>tiles[i].classList.remove('on'),420)}function play(){locked=true;input=[];status.textContent='Watch carefully…';seq.forEach((n,i)=>setTimeout(()=>flash(n),i*650+500));setTimeout(()=>{locked=false;status.textContent='Your turn.'},seq.length*650+600)}function tap(i){if(locked)return;flash(i);input.push(i);let p=input.length-1;if(input[p]!==seq[p]){locked=true;status.textContent='Almost! Starting again…';setTimeout(start,900);return}if(input.length===seq.length){level++;best=Math.max(best,level);localStorage.memoryBest=best;document.getElementById('level').textContent=level;document.getElementById('best').textContent=best;status.textContent='Correct!';setTimeout(()=>{seq.push(Math.floor(Math.random()*16));play()},700)}}function start(){level=1;seq=[Math.floor(Math.random()*16)];document.getElementById('level').textContent=1;play()}document.getElementById('start').onclick=start;</script></body></html>
