<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squence — Stack</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="topbar.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--background,#050318);color:var(--text,#fff);font-family:Inter,Arial,sans-serif;min-height:100vh}.background{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent,#a855ff) 18%,transparent),transparent 35%),linear-gradient(145deg,var(--background,#050318),var(--background2,#09062b))}.game-page{max-width:980px;margin:auto;padding:110px 20px 50px}.eyebrow{color:var(--accent,#a855ff);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.title{text-align:center;margin-bottom:30px}.title h1{font-size:clamp(38px,7vw,64px);letter-spacing:-3px;margin:8px 0}.title p{color:var(--muted,#aaa);margin:0}.panel{background:var(--card,rgba(14,11,45,.78));border:1px solid var(--card-border,rgba(151,92,255,.2));border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.25)}button{font:inherit;cursor:pointer}.btn{border:1px solid var(--card-border,rgba(255,255,255,.2));background:rgba(255,255,255,.08);color:var(--text,#fff);padding:11px 18px;border-radius:12px;font-weight:700}.btn:hover{transform:translateY(-2px)}.primary{background:linear-gradient(135deg,var(--accent,#a855ff),var(--accent2,#5968ff));border:none}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.stat{padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.05);color:var(--muted,#aaa)}.stat b{color:var(--text,#fff);font-size:22px;margin-left:5px}canvas{display:block;width:min(100%,520px);height:auto;margin:auto;border-radius:18px;background:#08071b;touch-action:manipulation}</style></head><body><div class="background"></div><main class="game-page"><div class="title"><div class="eyebrow">Squence Games</div><h1>Stack</h1><p>Drop the moving block at the perfect moment. Miss too much and it's game over.</p><div class="stats"><div class="stat">Score <b id="score">0</b></div><div class="stat">Best <b id="best">0</b></div></div><div class="panel"><canvas id="c" width="520" height="600"></canvas><div style="text-align:center;margin-top:15px"><button class="btn primary" id="start">Start / Restart</button></div></div></div></main><script src="topbar.js"></script><script></script></body></html>
