<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squence — Stack</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="topbar.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--background,#050318);color:var(--text,#fff);font-family:Inter,Arial,sans-serif;min-height:100vh}.background{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent,#a855ff) 18%,transparent),transparent 35%),linear-gradient(145deg,var(--background,#050318),var(--background2,#09062b))}.game-page{max-width:980px;margin:auto;padding:110px 20px 50px}.eyebrow{color:var(--accent,#a855ff);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.title{text-align:center;margin-bottom:30px}.title h1{font-size:clamp(38px,7vw,64px);letter-spacing:-3px;margin:8px 0}.title p{color:var(--muted,#aaa);margin:0}.panel{background:var(--card,rgba(14,11,45,.78));border:1px solid var(--card-border,rgba(151,92,255,.2));border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.25)}button{font:inherit;cursor:pointer}.btn{border:1px solid var(--card-border,rgba(255,255,255,.2));background:rgba(255,255,255,.08);color:var(--text,#fff);padding:11px 18px;border-radius:12px;font-weight:700}.btn:hover{transform:translateY(-2px)}.primary{background:linear-gradient(135deg,var(--accent,#a855ff),var(--accent2,#5968ff));border:none}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.stat{padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.05);color:var(--muted,#aaa)}.stat b{color:var(--text,#fff);font-size:22px;margin-left:5px}canvas{display:block;width:min(100%,520px);height:auto;margin:auto;border-radius:18px;background:#08071b;touch-action:manipulation}</style></head><body><div class="background"></div><main class="game-page"><div class="title"><div class="eyebrow">Squence Games</div><h1>Stack</h1><p>Drop the moving block at the perfect moment. Miss too much and it's game over.</p><div class="stats"><div class="stat">Score <b id="score">0</b></div><div class="stat">Best <b id="best">0</b></div></div><div class="panel"><canvas id="c" width="520" height="600"></canvas><div style="text-align:center;margin-top:15px"><button class="btn primary" id="start">Start / Restart</button></div></div></div></main><script src="topbar.js"></script><script>const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height;let blocks=[],moving,score=0,running=false,dir=1,best=+localStorage.stackBest||0;const bestEl=document.getElementById('best');bestEl.textContent=best;function reset(){blocks=[{x:120,w:280,y:H-45}];moving={x:0,w:280,y:H-85,s:4};score=0;running=true;document.getElementById('score').textContent=0;requestAnimationFrame(loop)}function loop(){if(!running)return;moving.x+=moving.s*dir;if(moving.x<0||moving.x+moving.w>W)dir*=-1;draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,W,H);blocks.forEach((b,i)=>{x.fillStyle='hsl('+(270+i*12)+',80%,62%)';x.fillRect(b.x,b.y,b.w,38)});if(moving){x.fillStyle='#fff';x.fillRect(moving.x,moving.y,moving.w,38)}}function drop(){if(!running)return;let l=blocks.at(-1),L=Math.max(l.x,moving.x),R=Math.min(l.x+l.w,moving.x+moving.w),w=R-L;if(w<=8){running=false;return}blocks.push({x:L,w,y:moving.y});score++;best=Math.max(best,score);localStorage.stackBest=best;document.getElementById('score').textContent=score;bestEl.textContent=best;moving={x:0,w,y:moving.y-40,s:Math.min(9,4+score*.25)};dir=1;if(moving.y<60){blocks=blocks.map(b=>({...b,y:b.y+80}));moving.y=60}}c.addEventListener('pointerdown',drop);document.getElementById('start').onclick=reset;reset();</script></body></html>
