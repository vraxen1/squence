<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squence — Orbit Escape</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="topbar.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--background,#050318);color:var(--text,#fff);font-family:Inter,Arial,sans-serif;min-height:100vh}.background{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent,#a855ff) 18%,transparent),transparent 35%),linear-gradient(145deg,var(--background,#050318),var(--background2,#09062b))}.game-page{max-width:980px;margin:auto;padding:110px 20px 50px}.eyebrow{color:var(--accent,#a855ff);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.title{text-align:center;margin-bottom:30px}.title h1{font-size:clamp(38px,7vw,64px);letter-spacing:-3px;margin:8px 0}.title p{color:var(--muted,#aaa);margin:0}.panel{background:var(--card,rgba(14,11,45,.78));border:1px solid var(--card-border,rgba(151,92,255,.2));border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.25)}button{font:inherit;cursor:pointer}.btn{border:1px solid var(--card-border,rgba(255,255,255,.2));background:rgba(255,255,255,.08);color:var(--text,#fff);padding:11px 18px;border-radius:12px;font-weight:700}.btn:hover{transform:translateY(-2px)}.primary{background:linear-gradient(135deg,var(--accent,#a855ff),var(--accent2,#5968ff));border:none}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.stat{padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.05);color:var(--muted,#aaa)}.stat b{color:var(--text,#fff);font-size:22px;margin-left:5px}canvas{display:block;width:min(100%,600px);height:auto;margin:auto;border-radius:18px;touch-action:none}</style></head><body><div class="background"></div><main class="game-page"><div class="title"><div class="eyebrow">Squence Games</div><h1>Orbit Escape</h1><p>Orbit the core. Dodge incoming debris and survive as long as possible.</p><div class="stats"><div class="stat">Time <b id="score">0.0</b>s</div><div class="stat">Best <b id="best">0.0</b>s</div></div><div class="panel"><canvas id="c" width="600" height="600"></canvas><p style="text-align:center;color:var(--muted)">Hold left/right arrow keys or drag to rotate.</p><div style="text-align:center"><button class="btn primary" id="start">Start / Restart</button></div></div></div></main><script src="topbar.js"></script><script>const c=document.getElementById('c'),x=c.getContext('2d');let a=0,spin=0,rocks=[],run=false,startTime,best=+localStorage.orbitBest||0,lastSpawn=0;document.getElementById('best').textContent=best;function go(){a=0;rocks=[];run=true;startTime=performance.now();requestAnimationFrame(loop)}function loop(t){if(!run)return;let dt=(t-startTime)/1000;document.getElementById('score').textContent=dt.toFixed(1);x.fillStyle='#070817';x.fillRect(0,0,600,600);let cx=300,cy=300;a+=spin*.055;spin*=.92;x.strokeStyle='rgba(150,100,255,.25)';x.beginPath();x.arc(cx,cy,150,0,7);x.stroke();x.fillStyle='#a855ff';x.beginPath();x.arc(cx,cy,36,0,7);x.fill();if(t-lastSpawn>700){let ang=Math.random()*Math.PI*2;rocks.push({x:cx+Math.cos(ang)*360,y:cy+Math.sin(ang)*360,vx:-Math.cos(ang)*(1.4+dt*.03),vy:-Math.sin(ang)*(1.4+dt*.03)});lastSpawn=t}let px=cx+Math.cos(a)*150,py=cy+Math.sin(a)*150;x.fillStyle='#fff';x.beginPath();x.arc(px,py,12,0,7);x.fill();for(let r of rocks){r.x+=r.vx;r.y+=r.vy;x.fillStyle='#ff668f';x.beginPath();x.arc(r.x,r.y,13,0,7);x.fill();if(Math.hypot(r.x-px,r.y-py)<23){run=false;best=Math.max(best,dt);localStorage.orbitBest=best;document.getElementById('best').textContent=best;return}}requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')spin=-1;if(e.key==='ArrowRight')spin=1});c.addEventListener('pointermove',e=>{if(e.buttons)spin=e.movementX/12});document.getElementById('start').onclick=go;go();</script></body></html>
