<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games - Squence</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="topbar.css">
<link rel="icon" type="image/png" href="favicon.png">
<style>
.games-page{min-height:calc(100vh - 100px);padding:70px 25px;max-width:1100px;margin:auto}.games-header{text-align:center;margin-bottom:50px}.games-header .badge{display:inline-block;margin-bottom:15px}.games-header h1{font-size:clamp(42px,7vw,68px);margin:0;letter-spacing:-3px;background:linear-gradient(120deg,#fff,#54d9ff,#9c7cff);-webkit-background-clip:text;background-clip:text;color:transparent}.games-header p{color:#888;font-size:17px;margin-top:15px}.games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}.game-card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:28px;transition:transform .2s,border-color .2s,box-shadow .2s}.game-card:hover{transform:translateY(-5px);border-color:rgba(84,217,255,.35);box-shadow:0 15px 40px rgba(0,0,0,.25)}.game-icon{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(84,217,255,.08);font-size:28px;margin-bottom:20px}.game-card h2{margin:0 0 8px;font-size:24px}.game-card p{color:#888;line-height:1.5;margin-bottom:22px}.play-button{display:inline-block;text-decoration:none;padding:11px 20px;border-radius:10px;background:#fff;color:#101015;font-weight:700;transition:transform .15s}.play-button:hover{transform:scale(1.03)}@media(max-width:500px){.games-page{padding:45px 18px}.games-header h1{letter-spacing:-2px}}
</style>
</head>
<body>
<div class="background"><div class="orb one"></div><div class="orb two"></div></div>
<main><section class="games-page"><div class="games-header"><div class="badge">🎮 Squence Arcade</div><h1>Games</h1><p>Quick games. Simple fun. All inside Squence.</p></div><div class="games-grid"><div class="game-card"><div class="game-icon">⚡</div><h2>Click Rush</h2><p>Click as fast as you can in 10 seconds. What's your best score?</p><a class="play-button" href="click-rush.html">Play Game →</a></div></div></section></main>
<script src="topbar.js"></script>
</body>
</html>
