<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Squence News</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #07070b;
        color: white;
        overflow-x: hidden;
    }

    /* Background */

    .background {
        position: fixed;
        inset: 0;
        z-index: -2;
        overflow: hidden;

        background:
            radial-gradient(
                circle at 20% 20%,
                rgba(120, 70, 255, 0.18),
                transparent 30%
            ),
            radial-gradient(
                circle at 80% 70%,
                rgba(0, 200, 255, 0.13),
                transparent 30%
            ),
            #07070b;
    }

    .orb {
        position: absolute;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.25;
        animation: float 12s infinite alternate ease-in-out;
    }

    .orb.one {
        background: #7c3cff;
        left: -100px;
        top: 10%;
    }

    .orb.two {
        background: #00c8ff;
        right: -100px;
        bottom: 5%;
        animation-delay: -5s;
    }

    @keyframes float {
        from {
            transform: translate(0, 0);
        }

        to {
            transform: translate(80px, -60px);
        }
    }

    /* Navigation */

    nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;

        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 20px 7%;

        background: rgba(7, 7, 11, 0.65);
        backdrop-filter: blur(15px);

        border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .logo {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -1px;
        text-decoration: none;
        color: white;
    }

    .logo span {
        color: #8c5cff;
    }

    nav a {
        color: #aaa;
        text-decoration: none;
        margin-left: 25px;
        transition: 0.2s;
    }

    nav a:hover {
        color: white;
    }

    /* Main */

    main {
        max-width: 1250px;
        margin: auto;
        padding: 150px 7% 80px;
    }

    .page-header {
        margin-bottom: 55px;
    }

    .badge {
        display: inline-block;

        padding: 8px 15px;

        border: 1px solid rgba(140, 92, 255, 0.4);
        border-radius: 100px;

        color: #bba5ff;
        background: rgba(140, 92, 255, 0.08);

        font-size: 14px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: clamp(55px, 9vw, 100px);
        line-height: 0.95;
        letter-spacing: -5px;
        margin-bottom: 20px;

        background: linear-gradient(
            120deg,
            #ffffff,
            #9c7cff,
            #54d9ff
        );

        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .subtitle {
        color: #888;
        font-size: 18px;
        line-height: 1.6;
        max-width: 650px;
    }

    /* Status */

    .status {
        display: flex;
        align-items: center;
        gap: 9px;

        margin-bottom: 30px;

        color: #777;
        font-size: 14px;
    }

    .status-dot {
        width: 9px;
        height: 9px;

        border-radius: 50%;

        background: #38e88b;
        box-shadow: 0 0 15px #38e88b;

        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% {
            opacity: 1;
        }

        50% {
            opacity: 0.4;
        }
    }

    /* Category buttons */

    .categories {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;

        margin-bottom: 40px;
    }

    .category {
        border: 1px solid rgba(255,255,255,0.08);

        background: rgba(255,255,255,0.04);

        color: #aaa;

        padding: 10px 17px;

        border-radius: 10px;

        cursor: pointer;

        transition: 0.2s;
    }

    .category:hover,
    .category.active {
        color: white;
        background: rgba(128, 92, 255, 0.18);
        border-color: rgba(128, 92, 255, 0.45);
    }

    /* News */

    .news-grid {
        display: grid;

        grid-template-columns:
            repeat(auto-fit, minmax(280px, 1fr));

        gap: 20px;
    }

    .article {
        display: flex;
        flex-direction: column;

        min-height: 310px;

        padding: 25px;

        background: rgba(255,255,255,0.035);

        border: 1px solid rgba(255,255,255,0.08);

        border-radius: 20px;

        transition: 0.3s;
    }

    .article:hover {
        transform: translateY(-7px);

        border-color: rgba(140, 92, 255, 0.45);

        background: rgba(140, 92, 255, 0.07);

        box-shadow:
            0 20px 60px rgba(0,0,0,0.3);
    }

    .article-category {
        display: inline-block;

        color: #a88cff;

        font-size: 12px;
        font-weight: bold;

        text-transform: uppercase;

        letter-spacing: 1px;

        margin-bottom: 15px;
    }

    .article h2 {
        font-size: 21px;
        line-height: 1.35;

        margin-bottom: 15px;
    }

    .article-description {
        color: #888;
        line-height: 1.6;

        margin-bottom: 20px;
    }

    .article-bottom {
        margin-top: auto;

        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 15px;
    }

    .source {
        color: #666;
        font-size: 13px;
    }

    .read {
        color: #9c7cff;

        text-decoration: none;

        font-weight: bold;

        font-size: 14px;

        white-space: nowrap;
    }

    .read:hover {
        color: white;
    }

    /* Loading */

    .loading {
        grid-column: 1 / -1;

        text-align: center;

        padding: 80px 20px;

        color: #666;
    }

    .spinner {
        width: 35px;
        height: 35px;

        margin: 0 auto 20px;

        border-radius: 50%;

        border: 3px solid rgba(255,255,255,0.08);
        border-top-color: #8c5cff;

        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* Error */

    .error {
        grid-column: 1 / -1;

        padding: 30px;

        border-radius: 15px;

        background: rgba(255,70,70,0.07);

        border: 1px solid rgba(255,70,70,0.2);

        color: #ff9999;

        line-height: 1.6;
    }

    /* Footer */

    footer {
        padding: 50px 7%;

        border-top: 1px solid rgba(255,255,255,0.06);

        text-align: center;

        color: #555;
    }

    footer strong {
        color: #aaa;
    }

    /* Mobile */

    @media (max-width: 600px) {

        nav {
            padding: 17px 5%;
        }

        nav .links {
            display: none;
        }

        main {
            padding-left: 5%;
            padding-right: 5%;
        }

        h1 {
            letter-spacing: -3px;
        }
    }
</style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>


<nav>

    <a class="logo" href="index.html">
        s<span>q</span>uence
    </a>

    <div class="links">
        <a href="index.html">Home</a>
        <a href="news.html">News</a>
        <a href="games.html">Games</a>
        <a href="index.html#pricing">Pricing</a>
    </div>

</nav>


<main>

    <div class="page-header">

        <div class="badge">
            ✦ Squence News
        </div>

        <h1>
            WHAT'S<br>
            HAPPENING?
        </h1>

        <p class="subtitle">
            Fresh headlines from around the world,
            technology, gaming and science.
        </p>

    </div>


    <div class="status">

        <div class="status-dot"></div>

        <span id="status">
            Connecting to Squence News...
        </span>

    </div>


    <div class="categories">

        <button
            class="category active"
            onclick="loadNews('world', this)">
            🌍 World
        </button>

        <button
            class="category"
            onclick="loadNews('technology', this)">
            💻 Technology
        </button>

        <button
            class="category"
            onclick="loadNews('sports', this)">
            ⚽ Sports
        </button>

        <button
            class="category"
            onclick="loadNews('science', this)">
            🔬 Science
        </button>

        <button
            class="category"
            onclick="loadNews('top', this)">
            🔥 Top stories
        </button>

    </div>


    <div id="news" class="news-grid">

        <div class="loading">

            <div class="spinner"></div>

            Loading the latest headlines...

        </div>

    </div>

</main>


<footer>

    <p>
        © 2026 <strong>Squence</strong>.
        All rights reserved.
    </p>

</footer>


<script>

/*
=========================================================
SQUENCE NEWS API
=========================================================

1. Create an account at NewsData.io
2. Get your API key
3. Replace YOUR_API_KEY_HERE below.

IMPORTANT:
Do NOT use this setup with a secret/private API key in
a serious production website. Browser code is visible
to everyone.

For the prototype, this lets you test the news system.
Later we can move the API request to a backend.
=========================================================
*/

const API_KEY = "684c04a94fb927ecf6811942dca59dac49769c448eeb177be3acc2389c83533a";

const newsContainer =
    document.getElementById("news");

const statusText =
    document.getElementById("status");


async function loadNews(category = "world", button = null) {

    /*
    Highlight selected category
    */

    document
        .querySelectorAll(".category")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    if (button) {
        button.classList.add("active");
    }


    /*
    Show loading screen
    */

    newsContainer.innerHTML = `
        <div class="loading">

            <div class="spinner"></div>

            Loading the latest headlines...

        </div>
    `;

    statusText.textContent =
        "Fetching the latest headlines...";


    /*
    Build API request
    */

    let url =
        "https://freenewsapi.io/admin/api_keys.php" +
        "?apikey=" + API_KEY +
        "&language=en";


    /*
    Category handling
    */

    if (category === "technology") {

        url += "&category=technology";

    } else if (category === "sports") {

        url += "&category=sports";

    } else if (category === "science") {

        url += "&category=science";

    }


    try {

        const response =
            await fetch(url);

        const data =
            await response.json();


        /*
        Check API response
        */

        if (!response.ok || data.status === "error") {

            throw new Error(
                data.results?.message ||
                data.message ||
                "The news API returned an error."
            );

        }


        /*
        Check that articles exist
        */

        if (
            !data.results ||
            data.results.length === 0
        ) {

            newsContainer.innerHTML = `
                <div class="error">
                    No articles were found right now.
                    Try another category.
                </div>
            `;

            statusText.textContent =
                "No stories found.";

            return;
        }


        /*
        Display articles
        */

        newsContainer.innerHTML = "";

        data.results.forEach(article => {

            const card =
                document.createElement("article");

            card.className = "article";


            /*
            Clean up description
            */

            let description =
                article.description ||
                "No description available.";


            if (description.length > 180) {

                description =
                    description.substring(0, 180) +
                    "...";

            }


            /*
            Create article card
            */

            card.innerHTML = `

                <div>

                    <div class="article-category">
                        ${article.category?.[0] || "News"}
                    </div>

                    <h2>
                        ${escapeHTML(article.title)}
                    </h2>

                    <p class="article-description">
                        ${escapeHTML(description)}
                    </p>

                </div>

                <div class="article-bottom">

                    <span class="source">
                        ${escapeHTML(
                            article.source_id ||
                            "Unknown source"
                        )}
                    </span>

                    <a
                        class="read"
                        href="${article.link}"
                        target="_blank"
                        rel="noopener noreferrer">

                        Read article →
                    </a>

                </div>

            `;

            newsContainer.appendChild(card);

        });


        /*
        Update status
        */

        statusText.textContent =
            "News feed connected • Updated just now";

    }


    catch (error) {

        console.error(error);

        newsContainer.innerHTML = `

            <div class="error">

                <strong>
                    Couldn't load the news.
                </strong>

                <br><br>

                ${escapeHTML(error.message)}

                <br><br>

                Check your API key and try again.

            </div>

        `;

        statusText.textContent =
            "News feed unavailable.";

    }

}


/*
Simple HTML escaping so article text cannot
inject HTML into the page.
*/

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


/*
Initial load
*/

loadNews("world");


/*
Refresh every 10 minutes
*/

setInterval(() => {

    const active =
        document.querySelector(".category.active");

    if (active) {
        active.click();
    }

}, 10 * 60 * 1000);

</script>

</body>
</html>
